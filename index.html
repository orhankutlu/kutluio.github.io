<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kutlu.io</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --primary-color: #ffffff;
            --background-color: #000000;
            --accent-color: #4a90e2;
            --transition-speed: 0.3s;
            --tag-color: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--primary-color);
            font-family: 'SF Mono', 'Fira Code', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            line-height: 1.6;
        }

        #container {
            margin-bottom: 2rem;
            position: relative;
            height: 6rem;
            display: flex;
            align-items: center;
        }

        #text {
            display: inline;
            font-size: clamp(3rem, 8vw, 6rem);
            letter-spacing: -0.02em;
            font-weight: 600;
            line-height: 1;
        }

        #cursor {
            display: inline-block;
            width: 3px;
            height: clamp(3rem, 8vw, 6rem);
            background-color: var(--primary-color);
            margin-left: 5px;
            animation: blink 0.7s steps(1) infinite;
            position: relative;
            top: 0;
        }

        footer {
            margin-top: 2rem;
            font-size: clamp(1rem, 2vw, 1.2rem);
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
            text-align: center;
        }

        footer div {
            margin: 0.5rem 0;
        }

        .buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        footer a {
            color: var(--primary-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border: 1px solid var(--primary-color);
            border-radius: 25px;
            transition: all var(--transition-speed) ease;
        }

        footer a:hover {
            background-color: var(--primary-color);
            color: var(--background-color);
        }

        footer a svg {
            margin-right: 8px;
            width: 20px;
            height: 20px;
        }

        footer a:hover svg {
            fill: var(--background-color);
        }

        .tagline {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }

        .tags {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .tag {
            color: var(--tag-color);
            font-size: 0.9rem;
            transition: color var(--transition-speed) ease;
        }

        .tag:hover {
            color: var(--primary-color);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            footer {
                margin-top: 1.5rem;
            }
            
            footer a {
                padding: 0.4rem 0.8rem;
            }

            .tags {
                gap: 0.5rem;
            }

            .tag {
                font-size: 0.8rem;
            }

            .buttons-container {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <span id="text"></span><span id="cursor"></span>
    </div>
    <footer>
        <div class="tags">
            <span class="tag">#ai</span>
            <span class="tag">#saas</span>
            <span class="tag">#apps</span>
            <span class="tag">#consultancy</span>
        </div>
        <div class="tagline">transform ideas into software products.</div>
        <div class="buttons-container">
            <a href="mailto:contact@kutlu.io">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                get in touch
            </a>
            <a href="/services">
                services
            </a>
        </div>
    </footer>
    <script>
        const textElement = document.getElementById('text');
        const footerElement = document.querySelector('footer');
        const textToType = "kutlu.io";
        const typingSpeed = 120;
        const loopDelay = 5000; // 5 seconds
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function typeText() {
            textElement.textContent = "";
            let i = 0;

            // Type text
            for (let char of textToType) {
                textElement.textContent += char;
                await sleep(typingSpeed);
            }

            // Wait for the remainder of the 5 seconds
            await sleep(loopDelay - (textToType.length * typingSpeed));
        }

        async function startAnimation() {
            footerElement.style.opacity = 1;
            while (true) {
                await typeText();
            }
        }

        document.addEventListener('DOMContentLoaded', startAnimation);
    </script>
</body>
</html>
